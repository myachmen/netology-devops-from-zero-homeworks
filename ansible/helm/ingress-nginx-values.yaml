# SUPERSEDED: retired community ingress-nginx; NOT FOR DEPLOYMENT.
# Use the separately approved Traefik profile; see traefik-migration.md.
controller:
  admissionWebhooks:
    patch:
      image:
        digest: ''
  image:
    digest: ''
  ingressClass: nginx
  ingressClassResource:
    default: false
    enabled: true
    name: nginx
  metrics:
    enabled: true
  replicaCount: 2
  service:
    nodePorts:
      http: 30080
      https: 30443
    type: NodePort
    externalTrafficPolicy: Cluster
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: kubernetes.io/hostname
            operator: In
            values:
            - k8s-worker-1
            - k8s-worker-2
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: ingress-nginx
            app.kubernetes.io/component: controller
        topologyKey: kubernetes.io/hostname
