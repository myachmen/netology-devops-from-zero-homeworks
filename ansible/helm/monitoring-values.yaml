alertmanager:
  alertmanagerSpec:
    resources:
      limits:
        cpu: 200m
        memory: 256Mi
      requests:
        cpu: 50m
        memory: 64Mi
  enabled: true
grafana:
  enabled: true
  persistence:
    enabled: false
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: web
      traefik.ingress.kubernetes.io/router.priority: '10'
    labels:
      diploma-ingress: enabled
    hosts:
    - grafana.diploma.local
    path: /
    pathType: Prefix
    tls: []
  grafana.ini:
    auth.anonymous:
      enabled: false
kube-state-metrics:
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi
prometheus:
  prometheusSpec:
    resources:
      limits:
        cpu: 1000m
        memory: 1Gi
      requests:
        cpu: 200m
        memory: 512Mi
    retention: 7d
    storageSpec:
      emptyDir:
        medium: ''
        sizeLimit: 5Gi
prometheusOperator:
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
kubeEtcd:
  endpoints:
  - 10.10.1.13
