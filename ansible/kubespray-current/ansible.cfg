[defaults]
inventory = ./inventory.py
host_key_checking = True
retry_files_enabled = False
timeout = 10
interpreter_python = /usr/bin/python3

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False
become_flags = -H -S -n

[ssh_connection]
ssh_args = -o ControlMaster=no -o ControlPersist=no -o ConnectionAttempts=1 -o ForwardAgent=no
retries = 0
pipelining = True

[inventory]
enable_plugins = script
unparsed_is_failed = True
