- name: Install and run Elasticsearch in Docker
  hosts: elasticsearch_hosts
  become: true

  vars:
    elasticsearch_compose_dir: /opt/elasticsearch

  tasks:
    - name: Update apt cache
      apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install prerequisite packages
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present

    - name: Create directory for Docker GPG key
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Download Docker GPG key
      get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Add Docker repository
      apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        filename: docker

    - name: Install Docker packages
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Ensure Docker service is enabled and started
      service:
        name: docker
        state: started
        enabled: true

    - name: Create Elasticsearch directory
      file:
        path: "{{ elasticsearch_compose_dir }}"
        state: directory
        mode: '0755'

    - name: Copy docker-compose.yml for Elasticsearch
      copy:
        dest: "{{ elasticsearch_compose_dir }}/docker-compose.yml"
        mode: '0644'
        content: |
          services:
            elasticsearch:
              image: docker.elastic.co/elasticsearch/elasticsearch:8.12.2
              container_name: elasticsearch
              restart: unless-stopped
              environment:
                - discovery.type=single-node
                - xpack.security.enabled=false
                - ES_JAVA_OPTS=-Xms1g -Xmx1g
              ulimits:
                memlock:
                  soft: -1
                  hard: -1
              volumes:
                - esdata:/usr/share/elasticsearch/data
              ports:
                - "9200:9200"

          volumes:
            esdata:

    - name: Run Elasticsearch container
      command: docker compose up -d
      args:
        chdir: "{{ elasticsearch_compose_dir }}"

    - name: Wait for Elasticsearch to respond
      uri:
        url: http://127.0.0.1:9200
        method: GET
        status_code: 200
      register: elasticsearch_check
      retries: 20
      delay: 10
      until: elasticsearch_check.status == 200
