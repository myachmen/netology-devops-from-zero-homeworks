name: Diploma migration offline tests
on:
  push:
    branches: [feature/diploma-ci-branch-migration-20261109]
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install test-only dependency
        run: python -m pip install 'PyYAML==6.0.2'
      - name: Compile Python modules
        run: python -m compileall -q ci/terraform tests
      - name: Run isolated unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
